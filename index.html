<!doctype html><html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070707"><title>BE STRONGER V14</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css">
</head><body>
<div id="authGate" class="authGate">
  <div class="authCard">
    <div class="brand"><i>BS</i> BE STRONGER <small>V22</small></div>
    <div class="authTabs"><button id="tabLogin" class="on" onclick="authMode('login')">CONNEXION</button><button id="tabSignup" onclick="authMode('signup')">INSCRIPTION</button></div>
    <h1 id="authTitle">Bienvenue.</h1>
    <p id="authText" class="muted">Connecte-toi à ton espace BE STRONGER.</p>
    <input id="authName" class="authInput hidden" placeholder="Nom / prénom">
    <input id="authEmail" class="authInput" type="email" placeholder="Email">
    <input id="authPassword" class="authInput" type="password" placeholder="Mot de passe (6 caractères minimum)">
    <input id="authCode" class="authInput hidden" placeholder="Code coach (si coaching déjà payé)"><div id="accessChoice" class="accessChoice hidden"><button class="chosen" onclick="chooseAccess('coaching')">🎟️ J’AI DÉJÀ UN COACH</button><button onclick="chooseAccess('premium')">⭐ JE M’ENTRAÎNE SEUL</button></div>
    <div id="authRole" class="roleBox hidden"><button class="on" onclick="setRole('client')">SPORTIF</button><button onclick="setRole('coach')">COACH</button></div>
    <button class="primary" onclick="submitAuth()" id="authSubmit">SE CONNECTER</button>
    <button class="secondary" onclick="demoLogin()">DÉMO HORS LIGNE</button>
    <div class="legalHint">En créant un compte, tu acceptes les conditions et la politique de confidentialité.</div><p id="authMsg" class="hint"></p>
  </div>
</div>
<div id="app">
<aside class="side"><div class="brand"><i>BS</i> BE STRONGER <small>V14</small></div><div id="nav"></div><div class="sideBottom"><span id="access"></span><button onclick="logout()">↪ Déconnexion</button></div></aside>
<main><header><button class="hamb" onclick="toggleSide()">☰</button><div><b id="title"></b><small id="subtitle"></small></div><div class="headRight"><span id="topAccess" class="badge"></span><button class="avatar" onclick="page('profil')">BS</button></div></header><section id="content"></section></main>
<div id="modal" class="modal hidden"><div class="modalBox"><button class="x" onclick="closeModal()">×</button><div id="modalContent"></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></body></html>
